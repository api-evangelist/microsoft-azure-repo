meters:
  - name: basic_users
    description: Users with Basic access level (paid above the first 5).
    unit: user-month
    aggregation: max
    dimensions:
      - organization
      - team
      - cost_center
  - name: stakeholder_users
    description: Free Stakeholder users (informational; not billed).
    unit: user-month
    aggregation: max
    dimensions:
      - organization
  - name: ghas_committers
    description: Active committers triggering GitHub Advanced Security charges.
    unit: committer-month
    aggregation: max
    dimensions:
      - repository
      - organization
  - name: storage_gb
    description: Repository storage consumed (informational; not directly billed under Basic).
    unit: GB
    aggregation: max
    dimensions:
      - repository
principles:
  - name: Visibility
    description: Use Organization Settings > Users + Last Access to find inactive Basic users.
      Pull data via the Member Entitlement Management REST API to drive a periodic audit. Cost
      Management line items appear as 'Azure DevOps - Basic Users' on the Azure invoice.
  - name: Allocation
    description: Tag users by team via Azure DevOps groups; multi-org billing centralizes
      spend across orgs to one Azure subscription. Use group rules to assign access by
      Entra ID group membership.
  - name: Optimization
    description: Audit Last Access date — users not signed in for 30+ days should be downgraded
      to Stakeholder (free). Avoid double-paying VS subscribers (auto-detected). Use multi-org
      billing so contractors with multi-org access pay once. Disable GHAS on archived/abandoned
      repos.
  - name: Accountability
    description: Project Collection Administrators set the default access level. Establish a
      monthly inactive-user review and a budget alert at the Azure subscription level.
