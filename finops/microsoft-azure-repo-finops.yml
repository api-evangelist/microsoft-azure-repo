description: FOCUS-aligned FinOps for Azure Repos — billed per Basic-access user per month
  ($6) above the free 5-user grant, plus optional GitHub Advanced Security for Azure DevOps
  per-active-committer add-on. Largest waste pattern is paying for inactive Basic users.
