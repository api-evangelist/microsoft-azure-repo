specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Azure Repos
providerId: microsoft-azure-repo
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - DevOps
  - Git
  - Repositories
  - Source Control
  - TFVC
  - Version Control
description: Azure Repos is sold as part of Azure DevOps Services and is licensed per user
  with the Basic access level. Up to 5 users get Basic access free; users 6+ pay $6.00/user/month.
  Stakeholder access (read-only/limited) is free for unlimited users. Visual Studio subscribers
  and GitHub Enterprise users get Basic access at no extra charge. Repos has unlimited private
  Git repos, unlimited file size, branch policies, and pull requests under Basic access.
sources:
  - https://azure.microsoft.com/pricing/details/devops/azure-devops-services/
  - https://learn.microsoft.com/en-us/azure/devops/organizations/billing/buy-basic-access-add-users
plans:
  - id: microsoft-azure-repo-stakeholder
    name: Stakeholder (Free)
    type: freemium
    description: Free, unlimited users with limited Repos access. Can view code and submit work
      items but cannot create branches/PRs.
    entries:
      - label: Stakeholder users
        name: stakeholder_users
        type: quota
        metric: user
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
    elements:
      - name: View public/private repo content
      - name: Comment on pull requests
      - name: Limited write access
  - id: microsoft-azure-repo-basic
    name: Basic (Free for 5 users, then $6/user)
    type: tiered
    description: Full Repos functionality. First 5 Basic users free; users 6 and beyond billed
      monthly. VS Subscribers and GitHub Enterprise users do not count.
    entries:
      - label: Basic users (first 5)
        name: basic_users_free_tier
        type: quota
        metric: user
        limit: 5
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
      - label: Basic users (6+)
        name: basic_users_paid
        type: subscription
        metric: user-month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '$6.00 per user per month'
        userMultiplied: true
    elements:
      - name: Unlimited private Git repos
      - name: Branch policies & code review
      - name: Pull requests
      - name: Repo size unlimited
      - name: GitHub Advanced Security available as add-on
  - id: microsoft-azure-repo-vs-subscriber
    name: Visual Studio Subscriber (Included)
    type: subscription
    description: Users with active Visual Studio Professional / Enterprise / Test Professional
      / MSDN subscriptions get Basic + Test Plans access at no extra cost.
    entries:
      - label: VS subscriber access
        name: vs_subscriber_seat
        type: subscription
        metric: user-month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: included with Visual Studio subscription
        userMultiplied: true
    elements:
      - name: Basic + Test Plans
      - name: No extra Azure DevOps charge
  - id: microsoft-azure-repo-advanced-security
    name: GitHub Advanced Security for Azure DevOps
    type: subscription
    description: Optional add-on enabling code scanning, secret scanning, and dependency
      review on Azure Repos. Billed per active committer per month.
    entries:
      - label: Per active committer per month
        name: ghas_committer
        type: subscription
        metric: committer-month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '$49 per active committer per month'
        userMultiplied: true
    elements:
      - name: Secret scanning
      - name: Code scanning (CodeQL)
      - name: Dependency review
  - id: microsoft-azure-repo-enterprise
    name: Enterprise / Volume Licensing
    type: enterprise
    description: Enterprise Agreement, Microsoft Customer Agreement, or CSP-negotiated rates;
      multi-org billing centralizes per-user spend across organizations.
    entries:
      - label: Negotiated rate
        name: ea_negotiated
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Volume discounts
      - name: Multi-organization billing
      - name: Dedicated technical account management
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: https://azure.microsoft.com/services/devops/repos/
