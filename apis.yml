    humanURL: https://docs.microsoft.com/en-us/rest/api/azure/devops/git/
    baseURL: https://dev.azure.com/{organization}/{project}/_apis/git
    tags:
      - Branches
      - Commits
      - Git
      - Pull Requests
      - Repositories
