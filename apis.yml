name: Azure Repos
description: >-
  Azure Repos is a set of version control tools that you can use to manage your code. Whether your software project is
  large or small, using version control as soon as possible is a good idea.
image: https://docs.microsoft.com/en-us/azure/devops/repos/media/index/repos.svg
tags:
  - DevOps
  - Git
  - Repositories
  - Source Control
  - TFVC
  - Version Control
created: '2024-01-01'
modified: '2026-05-19'
url: https://azure.microsoft.com/en-us/services/devops/repos/
specificationVersion: '0.18'
apis:
