naftiko: 1.0.0-alpha2
info:
  label: Azure Repos Git API — Pull Request Threads
  description: 'Azure Repos Git API — Pull Request Threads. 2 operations. Lead operation: Azure Repos List pull request threads.
    Self-contained Naftiko capability covering one Microsoft Azure Repo business surface.'
  tags:
  - Microsoft Azure Repo
  - Pull Request Threads
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_AZURE_REPO_API_KEY: MICROSOFT_AZURE_REPO_API_KEY
capability:
