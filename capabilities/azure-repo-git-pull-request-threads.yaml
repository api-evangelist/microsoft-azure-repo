  - type: http
    namespace: azure-repo-git-pull-request-threads
    baseUri: https://dev.azure.com/{organization}/{project}/_apis
    description: Azure Repos Git API — Pull Request Threads business capability. Self-contained, no shared references.
    resources:
    - name: git-repositories-repositoryId-pullrequests-pullRequestId-threads
      path: /git/repositories/{repositoryId}/pullrequests/{pullRequestId}/threads
      operations:
      - name: pullrequestthreadslist
        method: GET
        description: Azure Repos List pull request threads
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: pullrequestthreadscreate
        method: POST
        description: Azure Repos Create a comment thread
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_AZURE_REPO_API_KEY}}'
  exposes:
  - type: rest
    namespace: azure-repo-git-pull-request-threads-rest
    port: 8080
    description: REST adapter for Azure Repos Git API — Pull Request Threads. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/git/repositories/{repositoryid}/pullrequests/{pullrequestid}/threads
      name: git-repositories-repositoryid-pullrequests-pullrequestid-threads
      description: REST surface for git-repositories-repositoryId-pullrequests-pullRequestId-threads.
      operations:
      - method: GET
        name: pullrequestthreadslist
        description: Azure Repos List pull request threads
        call: azure-repo-git-pull-request-threads.pullrequestthreadslist
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: pullrequestthreadscreate
        description: Azure Repos Create a comment thread
        call: azure-repo-git-pull-request-threads.pullrequestthreadscreate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: azure-repo-git-pull-request-threads-mcp
    port: 9090
    transport: http
    description: MCP adapter for Azure Repos Git API — Pull Request Threads. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: azure-repos-list-pull-request
      description: Azure Repos List pull request threads
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: azure-repo-git-pull-request-threads.pullrequestthreadslist
      outputParameters:
      - type: object
        mapping: $.
    - name: azure-repos-create-comment-thread
      description: Azure Repos Create a comment thread
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: azure-repo-git-pull-request-threads.pullrequestthreadscreate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
