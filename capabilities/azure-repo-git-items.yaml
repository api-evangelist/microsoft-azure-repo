naftiko: 1.0.0-alpha2
info:
  label: Azure Repos Git API — Items
  description: 'Azure Repos Git API — Items. 1 operations. Lead operation: Azure Repos List items (files and folders). Self-contained
    Naftiko capability covering one Microsoft Azure Repo business surface.'
  tags:
  - Microsoft Azure Repo
  - Items
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_AZURE_REPO_API_KEY: MICROSOFT_AZURE_REPO_API_KEY
capability:
  consumes:
  - type: http
    namespace: azure-repo-git-items
    baseUri: https://dev.azure.com/{organization}/{project}/_apis
    description: Azure Repos Git API — Items business capability. Self-contained, no shared references.
    resources:
    - name: git-repositories-repositoryId-items
      path: /git/repositories/{repositoryId}/items
      operations:
      - name: itemslist
        method: GET
        description: Azure Repos List items (files and folders)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: scopePath
          in: query
          type: string
          description: The path scope for items (e.g., /src or /README.md)
        - name: recursionLevel
          in: query
          type: string
          description: Level of recursion for folder listing
        - name: versionDescriptor.version
          in: query
          type: string
          description: Branch name, tag, or commit to get items from
        - name: versionDescriptor.versionType
          in: query
          type: string
          description: Type of version identifier
        - name: includeContentMetadata
          in: query
          type: boolean
          description: Include content metadata for items
        - name: latestProcessedChange
          in: query
          type: boolean
          description: Include the latest change for each item
        - name: includeLinks
          in: query
          type: boolean
          description: Include reference links
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_AZURE_REPO_API_KEY}}'
  exposes:
  - type: rest
    namespace: azure-repo-git-items-rest
    port: 8080
    description: REST adapter for Azure Repos Git API — Items. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/git/repositories/{repositoryid}/items
      name: git-repositories-repositoryid-items
      description: REST surface for git-repositories-repositoryId-items.
      operations:
      - method: GET
        name: itemslist
        description: Azure Repos List items (files and folders)
        call: azure-repo-git-items.itemslist
        with:
          scopePath: rest.scopePath
          recursionLevel: rest.recursionLevel
          versionDescriptor.version: rest.versionDescriptor.version
          versionDescriptor.versionType: rest.versionDescriptor.versionType
          includeContentMetadata: rest.includeContentMetadata
          latestProcessedChange: rest.latestProcessedChange
          includeLinks: rest.includeLinks
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: azure-repo-git-items-mcp
    port: 9090
    transport: http
    description: MCP adapter for Azure Repos Git API — Items. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: azure-repos-list-items-files
      description: Azure Repos List items (files and folders)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: azure-repo-git-items.itemslist
      with:
        scopePath: tools.scopePath
        recursionLevel: tools.recursionLevel
        versionDescriptor.version: tools.versionDescriptor.version
        versionDescriptor.versionType: tools.versionDescriptor.versionType
        includeContentMetadata: tools.includeContentMetadata
        latestProcessedChange: tools.latestProcessedChange
        includeLinks: tools.includeLinks
      outputParameters:
      - type: object
        mapping: $.
