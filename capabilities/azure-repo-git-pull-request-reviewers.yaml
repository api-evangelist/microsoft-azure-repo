naftiko: 1.0.0-alpha2
info:
  label: Azure Repos Git API — Pull Request Reviewers
  description: 'Azure Repos Git API — Pull Request Reviewers. 3 operations. Lead operation: Azure Repos List pull request
    reviewers. Self-contained Naftiko capability covering one Microsoft Azure Repo business surface.'
  tags:
  - Microsoft Azure Repo
  - Pull Request Reviewers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_AZURE_REPO_API_KEY: MICROSOFT_AZURE_REPO_API_KEY
capability:
  consumes:
  - type: http
    namespace: azure-repo-git-pull-request-reviewers
    baseUri: https://dev.azure.com/{organization}/{project}/_apis
    description: Azure Repos Git API — Pull Request Reviewers business capability. Self-contained, no shared references.
    resources:
    - name: git-repositories-repositoryId-pullrequests-pullRequestId-reviewers
      path: /git/repositories/{repositoryId}/pullrequests/{pullRequestId}/reviewers
      operations:
      - name: pullrequestreviewerslist
        method: GET
        description: Azure Repos List pull request reviewers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: git-repositories-repositoryId-pullrequests-pullRequestId-reviewers-reviewerId
      path: /git/repositories/{repositoryId}/pullrequests/{pullRequestId}/reviewers/{reviewerId}
      operations:
      - name: pullrequestreviewerscreateorupdate
        method: PUT
        description: Azure Repos Add or update a reviewer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: reviewerId
          in: path
          type: string
          description: ID of the reviewer identity
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: pullrequestreviewersdelete
        method: DELETE
        description: Azure Repos Remove a reviewer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: reviewerId
          in: path
          type: string
          description: ID of the reviewer identity to remove
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_AZURE_REPO_API_KEY}}'
  exposes:
  - type: rest
    namespace: azure-repo-git-pull-request-reviewers-rest
    port: 8080
    description: REST adapter for Azure Repos Git API — Pull Request Reviewers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/git/repositories/{repositoryid}/pullrequests/{pullrequestid}/reviewers
      name: git-repositories-repositoryid-pullrequests-pullrequestid-reviewers
      description: REST surface for git-repositories-repositoryId-pullrequests-pullRequestId-reviewers.
      operations:
      - method: GET
        name: pullrequestreviewerslist
        description: Azure Repos List pull request reviewers
        call: azure-repo-git-pull-request-reviewers.pullrequestreviewerslist
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/git/repositories/{repositoryid}/pullrequests/{pullrequestid}/reviewers/{reviewerid}
      name: git-repositories-repositoryid-pullrequests-pullrequestid-reviewers-reviewerid
      description: REST surface for git-repositories-repositoryId-pullrequests-pullRequestId-reviewers-reviewerId.
      operations:
      - method: PUT
        name: pullrequestreviewerscreateorupdate
        description: Azure Repos Add or update a reviewer
        call: azure-repo-git-pull-request-reviewers.pullrequestreviewerscreateorupdate
        with:
          reviewerId: rest.reviewerId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: pullrequestreviewersdelete
        description: Azure Repos Remove a reviewer
        call: azure-repo-git-pull-request-reviewers.pullrequestreviewersdelete
        with:
          reviewerId: rest.reviewerId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: azure-repo-git-pull-request-reviewers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Azure Repos Git API — Pull Request Reviewers. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: azure-repos-list-pull-request
      description: Azure Repos List pull request reviewers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: azure-repo-git-pull-request-reviewers.pullrequestreviewerslist
      outputParameters:
      - type: object
        mapping: $.
    - name: azure-repos-add-update-reviewer
      description: Azure Repos Add or update a reviewer
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: azure-repo-git-pull-request-reviewers.pullrequestreviewerscreateorupdate
      with:
        reviewerId: tools.reviewerId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: azure-repos-remove-reviewer
      description: Azure Repos Remove a reviewer
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: azure-repo-git-pull-request-reviewers.pullrequestreviewersdelete
      with:
        reviewerId: tools.reviewerId
      outputParameters:
      - type: object
        mapping: $.
